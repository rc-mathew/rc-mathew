name: Generate 3D contribution graph

on:
  schedule:
    - cron: "0 18 * * *"   # daily, 18:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: rc-mathew

      - name: Commit generated SVGs
        run: |
          git config user.name "Reuben C Mathew"
          git config user.email "257684634+rc-mathew@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --cached --quiet || git commit -m "chore: update 3D contribution graph"
          git push
